faq:
  titulo: Perguntas frequentes
  itens:
    - pergunta: A partir de qual idade vocês recebem as crianças?
      resposta: Recebemos bebês a partir de 4 meses no Berçário e acompanhamos a criança até os 5 anos, na Pré-escola.
    - pergunta: Quais são os horários e períodos?
      resposta: Funcionamos de segunda a sexta, das 7h às 18h30, com opções de manhã, tarde ou período integral.
    - pergunta: Quantas crianças há em cada turma?
      resposta: No máximo 10 crianças por sala, com professora e auxiliar de desenvolvimento infantil. É o que permite um acompanhamento realmente individual.
    - pergunta: Qual é o material didático?
      resposta: Usamos o sistema Conquista Solução Educacional, organizado por faixa etária (2 a 5 anos), com livros semestrais, livro de Artes e de Inglês a partir dos 3 anos, além do Almanaque da Família.
    - pergunta: Quais aulas extras a escola oferece?
      resposta: Ballet, Cross Kids, Música e Inglês, dentro da própria escola. Na visita explicamos dias, turmas e valores.
    - pergunta: Como acompanho o dia a dia do meu filho?
      resposta: Pelo livro de recados, pelo Almanaque da Família, nas reuniões de pais e pelos registros em fotos e vídeos das atividades. E a nossa porta está sempre aberta para conversar.
    - pergunta: Como funciona a adaptação?
      resposta: A adaptação é gradual. Nos primeiros dias a criança fica menos tempo na escola, e esse tempo aumenta aos poucos até ela entrar na rotina da turma, que todas as crianças seguem. Explicamos tudo com calma na visita.
    - pergunta: A escola oferece alimentação?
      resposta: Sim. A escola serve lanche da manhã, almoço, lanche da tarde e jantar, no refeitório, de acordo com o período de cada criança. O cardápio é acompanhado por nutricionista, e alergias e restrições são conversadas com a família.
    - pergunta: Qual é o valor da mensalidade?
      resposta: Os valores variam conforme a turma e o período (meio período ou integral). Enviamos a tabela atualizada pelo WhatsApp e apresentamos tudo na visita.
    - pergunta: Onde fica a escola?
      resposta: Na Rua Colorado, 29, no Jardim Rancho Alegre, em Santana de Parnaíba. Recebemos famílias de Santana de Parnaíba, Barueri e Cajamar.

