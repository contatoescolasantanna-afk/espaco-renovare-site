diferenciais:
  titulo: Por que as famílias escolhem o Renovare
  subtitulo: Uma escola pequena de propósito. Aqui cada criança é vista, ouvida e acompanhada, e cada família tem nome, rosto e voz.
  itens:
    - icone: turma
      titulo: Turmas pequenas de verdade
      texto: No máximo 10 crianças por sala. A professora conhece o jeito, o tempo e as preferências de cada uma, e você sente isso no dia a dia.
    - icone: natureza
      titulo: Natureza no quintal
      texto: São 1.800 m² de área verde com parque, horta e pomar. Criança aqui planta, colhe acerola, jabuticaba e amora, se suja e aprende de verdade.
    - icone: arte
      titulo: Aprender pela arte
      texto: A arte conduz a nossa proposta. Pintura, música, teatro e construção com as mãos desenvolvem criatividade, autonomia e autoestima.
    - icone: livro
      titulo: Material Conquista + BNCC
      texto: Sistema de ensino Conquista Solução Educacional, com livros por faixa etária e Artes e Inglês a partir dos 3 anos, alinhado à BNCC.
    - icone: coracao
      titulo: A família sempre por perto
      texto: Livro de recados, Almanaque da Família, reuniões e registros em fotos e vídeos. Você acompanha cada pequena conquista do seu filho.
    - icone: estrela
      titulo: Aulas extras na própria escola
      texto: Ballet, Cross Kids, Música e Inglês no mesmo lugar, na rotina da criança, sem você precisar correr para outro endereço.

proposta:
  titulo: Uma proposta que respeita o tempo de cada criança
  texto: |-
    No Espaço Renovare acreditamos que cada criança é única e que aprender é uma aventura singular. Por isso, a arte, o brincar e a natureza são os caminhos do nosso dia a dia.

    As crianças exploram, levantam hipóteses, resolvem problemas e constroem conhecimento com significado, sempre com afeto, respeito e muita escuta. Nosso nome vem do italiano *renovare*, renovar: o sol do nosso logo representa um novo dia e uma nova oportunidade de descobrir o mundo.
  frase_manuscrita: Educar hoje para um amanhã melhor!
  imagem: /images/uploads/professora-acompanhando.jpg
  imagem_alt: Professora orientando um aluno durante atividade de pintura com as mãos
  pilares:
    - titulo: Autoconhecimento e autoestima
      texto: A criança aprende a reconhecer o que sente, a confiar em si e a respeitar o outro.
    - titulo: Aprendizagem por projetos
      texto: Projetos como o Livro que Anda, a Festa da Família e as datas especiais envolvem crianças e famílias.
    - titulo: Salas ambientes
      texto: Ateliê de artes, quintal, horta, pomar e parque organizados como um “terceiro educador”.
    - titulo: Documentação pedagógica
      texto: Registramos o processo de cada criança com fotos, vídeos e produções para a família acompanhar a evolução.

