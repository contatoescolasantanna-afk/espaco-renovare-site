titulo: Quem cuida do seu filho
subtitulo: Uma equipe pequena, próxima e que conhece cada criança pelo nome.
historia: |-
  O Espaço Renovare nasceu em 1º de agosto de 2013, com o nome de Escola Santanna, em Santana de Parnaíba. Com o tempo, a escola ganhou um novo nome: **Renovare**, que vem do italiano e significa *renovar*.

  O sol do nosso logo representa exatamente isso: um novo dia, uma nova chance, uma nova oportunidade de viver algo novo. É assim que enxergamos a infância, com respeito, afeto e muita descoberta, do berçário à pré-escola.
missao: Acolher cada criança como única, aprendendo pela arte, pelo brincar e pela natureza, em parceria com as famílias.
