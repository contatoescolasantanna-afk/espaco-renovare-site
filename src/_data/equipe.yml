titulo: Quem cuida do seu filho
subtitulo: Uma equipe pequena, próxima e que conhece cada criança pelo nome.
historia: |-
  Nossa história começou em 2013, em Santana de Parnaíba. Ao nos tornarmos **Espaço Renovare**, renovamos tudo: a estrutura, a equipe e a energia da escola. O nome vem do italiano *renovare*, renovar, e traduz essa mudança.

  O sol do nosso logo representa um novo dia, uma nova chance, uma nova oportunidade de viver algo novo. É assim que enxergamos a infância, com respeito, afeto e muita descoberta, do berçário à pré-escola.
missao: Acolher cada criança como única, aprendendo pela arte, pelo brincar e pela natureza, em parceria com as famílias.
