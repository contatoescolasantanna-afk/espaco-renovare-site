# Publica o site no GitHub Pages a cada alteração (inclusive as feitas pelo painel Pages CMS)
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# "1" = o domínio oficial mostra só a página "Em construção" com os contatos.
# Para lançar o site completo, troque para "0" (a pré-visualização sempre mostra o site completo).
env:
  EM_CONSTRUCAO: "0"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Reaproveita as fotos já otimizadas (deixa a publicação bem mais rápida)
      - uses: actions/cache@v4
        with:
          path: _site/img
          key: fotos-${{ hashFiles('src/images/**') }}
          restore-keys: fotos-
      - run: npm run build
        env:
          SITE_PREVIEW: ${{ endsWith(github.repository, '.github.io') && '1' || '0' }}
          EM_CONSTRUCAO: ${{ env.EM_CONSTRUCAO }}
      # Na pré-visualização (repositório *.github.io) não usa o domínio próprio
      - if: endsWith(github.repository, '.github.io')
        run: rm -f _site/CNAME
      # Domínio oficial em construção: publica só a página "Em construção" com os contatos
      - name: Montar página em construção
        if: ${{ !endsWith(github.repository, '.github.io') && env.EM_CONSTRUCAO == '1' }}
        run: |
          mkdir -p _construcao/images/marca _construcao/fonts
          cp _site/em-construcao/index.html _construcao/index.html
          cp _site/em-construcao/index.html _construcao/404.html
          cp _site/CNAME _site/favicon.svg _site/favicon-48.png _site/apple-touch-icon.png _construcao/
          cp _site/fonts/fredoka.woff2 _site/fonts/nunito.woff2 _construcao/fonts/
          cp _site/images/marca/logo-horizontal.png _site/images/marca/logo-vertical.png _site/images/marca/compartilhar.jpg _construcao/images/marca/
          # Analytics: script do aviso de cookies e a política de privacidade (link do aviso)
          mkdir -p _construcao/js _construcao/politica-de-privacidade
          cp _site/js/main.js _construcao/js/
          cp _site/site.webmanifest _construcao/
          cp _site/politica-de-privacidade/index.html _construcao/politica-de-privacidade/
          printf 'User-agent: *\nAllow: /\n\nSitemap: https://espacorenovareinfantil.com.br/sitemap.xml\n' > _construcao/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://espacorenovareinfantil.com.br/</loc><lastmod>%s</lastmod></url>\n</urlset>\n' "$(date -u +%Y-%m-%d)" > _construcao/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ (!endsWith(github.repository, '.github.io') && env.EM_CONSTRUCAO == '1') && '_construcao' || '_site' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
