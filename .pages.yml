# =====================================================================
#  PAINEL DE EDIÇÃO (Pages CMS: https://app.pagescms.org)
#  Cada bloco abaixo vira um menu no painel. A escola edita textos e fotos
#  sem mexer em código; ao salvar, o site é republicado em 1 a 2 minutos.
#  Os menus mais usados vêm primeiro. Guia completo: COMO-EDITAR.md
# =====================================================================
media:
  input: src/images/uploads
  output: /images/uploads

content:
  # ------------------------------------------------------------------
  - name: blog
    label: "1. ✏️ Blog (artigos)"
    description: "Clique em 'Add an entry' para escrever um artigo novo. Ele começa como RASCUNHO: veja como ficou em espacorenovareinfantil.com.br/previa/ e, quando estiver bom, desmarque Rascunho e salve."
    type: collection
    path: src/blog
    filename: "{primary}.md"
    exclude: [index.njk, blog.11tydata.js]
    view:
      fields: [titulo, date, rascunho]
      primary: titulo
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - name: titulo
        label: Título do artigo
        type: string
        required: true
        description: "Uma pergunta ou frase que os pais buscariam no Google. Ex.: Como é a adaptação no berçário?"
      - name: rascunho
        label: "Rascunho (deixe marcado enquanto estiver escrevendo)"
        type: boolean
        default: true
        description: "Marcado = só a escola vê, em espacorenovareinfantil.com.br/previa/. Desmarque e salve para publicar para as famílias."
      - name: imagem
        label: Foto de capa
        type: image
        options: &foto { extensions: [jpg, jpeg, png, webp, JPG, JPEG, PNG] }
        description: "Foto deitada (horizontal), bem iluminada. Só JPG ou PNG. Crianças só com autorização e com o uniforme do Renovare."
      - name: imagem_alt
        label: Descreva a foto em uma frase
        type: string
        description: "Ex.: Professora lendo uma história para a turma do Maternal no gramado"
      - name: imagem_foco
        label: A foto cortou alguma cabeça?
        type: select
        options: &foco { values: ["rosto no alto", centro, "parte de baixo"] }
        description: "Se cortou, escolha 'rosto no alto'. Se não, deixe vazio."
      - name: resumo
        label: Resumo (1 ou 2 frases)
        type: text
        description: "Aparece embaixo do título e no cartão do artigo na lista do blog."
      - name: body
        label: Texto do artigo
        type: rich-text
        options: { format: markdown }
        description: "Escreva como numa conversa com os pais. Use o botão H2 para subtítulos e frases curtas. Para pôr uma foto no meio do texto, use o botão de imagem."
      - name: tema
        label: Assunto
        type: select
        options: { values: [Escolher a escola, Primeiros passos, Desenvolvimento infantil, Rotina da família, Matrículas] }
      - name: turmas
        label: Este artigo fala de qual turma? (opcional)
        type: select
        options: { multiple: true, values: [bercario, maternal, pre-escola] }
        description: "O artigo também aparece no fim da página dessa turma."
      - name: date
        label: Data do artigo
        type: date
        options: { format: yyyy-MM-dd }
        description: "Já vem com a data de hoje. Não precisa mudar."
      - name: faq
        label: Perguntas rápidas no fim do artigo (opcional)
        type: object
        list: true
        fields:
          - { name: pergunta, label: Pergunta, type: string }
          - { name: resposta, label: Resposta curta, type: text }
      - name: seo_titulo
        label: "Google (opcional): título diferente para a busca"
        type: string
        description: "Pode deixar vazio. Se usar, até 60 letras."
      - name: seo_descricao
        label: "Google (opcional): descrição na busca"
        type: text
        description: "Pode deixar vazio: o site usa o resumo. Se usar, até 155 letras."

  # ------------------------------------------------------------------
  - name: paginas
    label: "2. 📄 Páginas extras"
    description: "Crie páginas novas (ex.: Uniforme, Festa Junina, Material escolar). O endereço é o título: 'Uniforme' vira espacorenovareinfantil.com.br/uniforme/. Começa como RASCUNHO: confira em espacorenovareinfantil.com.br/previa/."
    type: collection
    path: src/paginas
    filename: "{primary}.md"
    exclude: [paginas.11tydata.js, .gitkeep]
    view:
      fields: [titulo, rascunho]
      primary: titulo
      sort: [ordem, titulo]
    fields:
      - name: titulo
        label: Título da página
        type: string
        required: true
        description: "Curto e claro. Ex.: Uniforme escolar"
      - name: rascunho
        label: "Rascunho (deixe marcado enquanto estiver montando)"
        type: boolean
        default: true
        description: "Marcado = só a escola vê, em espacorenovareinfantil.com.br/previa/. Desmarque e salve para publicar."
      - { name: resumo, label: Frase de abertura (opcional), type: text, description: "Aparece embaixo do título, em letras maiores." }
      - { name: imagem, label: Foto de capa (opcional), type: image, options: *foto, description: "Foto deitada (horizontal). Só JPG ou PNG." }
      - { name: imagem_alt, label: Descreva a foto em uma frase, type: string }
      - { name: imagem_foco, label: A foto cortou alguma cabeça?, type: select, options: *foco, description: "Se cortou, escolha 'rosto no alto'. Se não, deixe vazio." }
      - name: body
        label: Texto da página
        type: rich-text
        options: { format: markdown }
        description: "Use o botão H2 para subtítulos, listas para itens e o botão de imagem para fotos."
      - { name: no_rodape, label: Colocar link desta página no rodapé do site?, type: boolean, description: "O rodapé é a parte azul no fim de todas as páginas." }
      - { name: ordem, label: Posição no rodapé (1, 2, 3...), type: number }
      - { name: mostrar_cta, label: Mostrar o convite "Agendar visita" no fim?, type: boolean, default: true }
      - { name: seo_titulo, label: "Google (opcional): título para a busca", type: string, description: "Pode deixar vazio." }
      - { name: seo_descricao, label: "Google (opcional): descrição na busca", type: text, description: "Pode deixar vazio." }

  # ------------------------------------------------------------------
  - name: equipe
    label: "3. 👩‍🏫 Equipe e Quem somos"
    description: "Página espacorenovareinfantil.com.br/quem-somos/. Para pôr alguém novo: Pessoas da equipe → Add. Para tirar: lixeira ao lado do nome."
    type: file
    path: src/_data/equipe.yml
    format: yaml
    fields:
      - name: pessoas
        label: Pessoas da equipe
        type: object
        list: true
        description: "Arraste para mudar a ordem em que aparecem."
        fields:
          - { name: nome, label: Nome, type: string, description: "Ex.: Prof.ª Ana Paula" }
          - { name: funcao, label: Função, type: string, description: "Ex.: Professora do Maternal" }
          - { name: texto, label: Frase curta sobre a pessoa, type: text, description: "Uma ou duas linhas. Ex.: Pedagoga, apaixonada por contação de histórias." }
          - { name: foto, label: Foto de rosto, type: image, options: *foto, description: "Rosto bem iluminado, de frente, de preferência com o uniforme do Renovare. Só JPG ou PNG." }
          - { name: foto_foco, label: A foto cortou a cabeça?, type: select, options: *foco, description: "Se cortou, escolha 'rosto no alto'." }
      - { name: titulo, label: Título da seção da equipe, type: string }
      - { name: subtitulo, label: Frase embaixo do título, type: string }
      - { name: historia, label: História da escola, type: text, description: "Deixe uma linha em branco entre um parágrafo e outro." }
      - { name: missao, label: Missão (frase em destaque amarelo), type: text }

  # ------------------------------------------------------------------
  - name: home
    label: "4. 🏠 Página inicial"
    description: "Todos os textos e fotos da página principal, na ordem em que aparecem de cima para baixo."
    type: file
    path: src/_data/home.yml
    format: yaml
    fields:
      - name: hero
        label: "Parte 1. Abertura (o que aparece primeiro)"
        type: object
        fields:
          - { name: sobretitulo, label: Frase pequena acima do título, type: string }
          - { name: titulo, label: Título principal, type: string }
          - { name: titulo_destaque, label: Pedaço do título grifado em amarelo, type: string, description: "Copie exatamente as palavras do título que devem ficar grifadas." }
          - { name: subtitulo, label: Texto embaixo do título, type: text }
          - { name: botao_principal, label: Texto do botão amarelo, type: string }
          - { name: botao_secundario, label: Texto do botão do WhatsApp, type: string }
          - { name: frase_manuscrita, label: Bilhetinho escrito à mão, type: string }
          - { name: imagem_principal, label: Foto grande, type: image, options: *foto }
          - { name: imagem_principal_alt, label: Descreva a foto grande, type: string }
          - { name: imagem_principal_foco, label: A foto grande cortou alguma cabeça?, type: select, options: *foco }
          - { name: imagem_2, label: Foto pequena da direita, type: image, options: *foto }
          - { name: imagem_2_alt, label: Descreva a foto pequena da direita, type: string }
          - { name: imagem_3, label: Foto pequena da esquerda, type: image, options: *foto }
          - { name: imagem_3_alt, label: Descreva a foto pequena da esquerda, type: string }

      - name: numeros
        label: "Parte 2. Números em destaque"
        type: object
        list: { min: 2, max: 6 }
        fields:
          - { name: valor, label: "Número (ex.: 1.800 m²)", type: string }
          - { name: legenda, label: "Legenda (ex.: de área verde)", type: string }

      - name: diferenciais
        label: "Parte 3. Por que o Renovare"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Frase embaixo do título, type: text }
          - name: itens
            label: Cartões
            type: object
            list: true
            fields:
              - name: icone
                label: Desenho do cartão
                type: select
                options: { values: [turma, natureza, arte, livro, coracao, estrela, escudo, sol, musica] }
              - { name: titulo, label: Título do cartão, type: string }
              - { name: texto, label: Texto do cartão, type: text }

      - name: depoimentos
        label: "Parte 4. Depoimentos de famílias"
        description: "Só depoimentos reais (Google ou mensagem que a família autorizou). Se a lista ficar vazia, a seção some."
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Frase embaixo do título, type: string }
          - name: itens
            label: Depoimentos
            type: object
            list: true
            fields:
              - { name: nome, label: "Nome (ex.: Juliana S.)", type: string }
              - { name: relacao, label: "Quem é (ex.: mãe do Pedro, Maternal)", type: string }
              - { name: texto, label: Depoimento (copie as palavras da família), type: text }
              - name: fonte
                label: De onde veio
                type: select
                options: { values: [Google, Facebook, Instagram, WhatsApp, Família autorizou] }
              - { name: destaque, label: Cartão grande em destaque (marque só 1), type: boolean }
              - { name: foto, label: Foto (opcional, com autorização), type: image, options: *foto }

      - name: estrutura
        label: "Parte 5. Espaços da escola"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Frase embaixo do título, type: text }
          - name: espacos
            label: Espaços
            type: object
            list: true
            fields:
              - { name: nome, label: Nome do espaço, type: string }
              - { name: texto, label: Descrição, type: text }
              - { name: imagem, label: Foto, type: image, options: *foto }
              - { name: imagem_alt, label: Descreva a foto, type: string }
              - { name: foco, label: Ajuste da foto (opcional), type: string, description: "Pode deixar como está. Se a foto cortar algo, escreva: rosto no alto, centro ou parte de baixo." }
              - name: enquadramento
                label: Foto larga ocupando a linha toda?
                type: select
                options: { values: [panoramico] }
                description: "Escolha 'panoramico' só para fotos bem largas. Vazio = tamanho normal."

      - name: proposta
        label: "Parte 6. Proposta pedagógica"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text, description: "Deixe uma linha em branco entre um parágrafo e outro." }
          - { name: frase_manuscrita, label: Frase escrita à mão, type: string }
          - { name: imagem, label: Foto, type: image, options: *foto }
          - { name: imagem_alt, label: Descreva a foto, type: string }
          - { name: imagem_foco, label: A foto cortou alguma cabeça?, type: select, options: *foco }
          - name: pilares
            label: Pilares
            type: object
            list: true
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: texto, label: Texto, type: text }

      - name: extras
        label: "Parte 7. Aulas extras"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Frase embaixo do título, type: text }
          - name: itens
            label: Aulas
            type: object
            list: true
            fields:
              - { name: nome, label: Nome da aula, type: string }
              - name: icone
                label: Desenho (usado quando não há foto)
                type: select
                options: { values: [ballet, cross, musica, ingles, estrela, arte, coracao] }
              - { name: texto, label: Descrição, type: text }
              - { name: imagem, label: Foto (opcional), type: image, options: *foto }

      - name: galeria
        label: "Parte 8. Galeria de fotos"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Frase embaixo do título, type: string }
          - name: fotos
            label: Fotos (o ideal são 8)
            type: object
            list: true
            fields:
              - { name: imagem, label: Foto, type: image, options: *foto }
              - { name: alt, label: Descreva a foto, type: string }
              - { name: foco, label: Ajuste da foto (opcional), type: string, description: "Se a foto cortar algo, escreva: rosto no alto, centro ou parte de baixo." }

      - name: video
        label: "Parte 9. Vídeo do YouTube"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: youtube_id, label: Código do vídeo, type: string, description: "No link do YouTube, é o que vem depois de v= (ex.: dQw4w9WgXcQ). Vazio = seção escondida." }

      - name: visita
        label: "Parte 10. Agendar visita"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: subtitulo, label: Frase embaixo do título, type: text }
          - { name: info, label: "Dias e duração da visita (ex.: Seg a sex · 40 min)", type: string }
          - name: passos
            label: Passos da visita
            type: object
            list: true
            fields:
              - { name: titulo, label: Passo, type: string }
              - { name: texto, label: Descrição, type: string }

      - name: faq
        label: "Parte 11. Perguntas frequentes"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - name: itens
            label: Perguntas
            type: object
            list: true
            fields:
              - { name: pergunta, label: Pergunta, type: string }
              - { name: resposta, label: Resposta, type: text }

      - name: cta_final
        label: "Parte 12. Chamada final (fim da página)"
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: texto, label: Texto, type: text }

      - { name: imagem_compartilhamento, label: "Foto que aparece quando alguém manda o link do site no WhatsApp", type: image, options: *foto }
      - { name: seo_titulo, label: "Google: título da página inicial (até 60 letras)", type: string }
      - { name: seo_descricao, label: "Google: descrição da página inicial (até 155 letras)", type: text }

  # ------------------------------------------------------------------
  - name: turmas
    label: "5. 🎒 Turmas"
    description: "Cada turma tem sua própria página. Clique na turma para editar."
    type: collection
    path: src/turmas
    filename: "{primary}.md"
    exclude: [turmas.11tydata.js]
    view:
      fields: [titulo, faixa_etaria]
      primary: titulo
      sort: [ordem]
    fields:
      - { name: titulo, label: Nome da turma, type: string, required: true }
      - { name: faixa_etaria, label: "Idade (ex.: 1 a 3 anos)", type: string }
      - { name: resumo, label: Resumo (aparece no cartão da turma), type: text }
      - { name: imagem, label: Foto principal, type: image, options: *foto }
      - { name: imagem_alt, label: Descreva a foto principal, type: string }
      - { name: imagem_foco, label: A foto principal cortou alguma cabeça?, type: select, options: *foco }
      - { name: imagem_2, label: Foto secundária, type: image, options: *foto }
      - { name: imagem_2_alt, label: Descreva a foto secundária, type: string }
      - { name: destaques, label: 'Itens do quadro "Em resumo"', type: string, list: true }
      - { name: body, label: Texto da página, type: rich-text, options: { format: markdown } }
      - { name: ordem, label: Posição na lista (1, 2, 3), type: number }
      - name: cor
        label: Cor da turma
        type: select
        options: { values: [amarelo, azul, verde] }
      - { name: seo_titulo, label: "Google (opcional): título", type: string }
      - { name: seo_descricao, label: "Google (opcional): descrição", type: text }

  # ------------------------------------------------------------------
  - name: rotina
    label: "6. 🕘 Rotina do dia"
    description: "O quadro 'Um dia no Renovare', que aparece nas páginas das turmas."
    type: file
    path: src/_data/rotina.yml
    format: yaml
    fields:
      - { name: titulo, label: Título, type: string }
      - { name: subtitulo, label: Frase embaixo do título, type: text }
      - name: itens
        label: Momentos do dia (na ordem)
        type: object
        list: true
        fields:
          - { name: titulo, label: "Momento (ex.: 7h · Chegada)", type: string }
          - { name: texto, label: Descrição, type: string }

  # ------------------------------------------------------------------
  - name: alimentacao
    label: "7. 🍎 Alimentação"
    type: file
    path: src/_data/alimentacao.yml
    format: yaml
    fields:
      - { name: titulo, label: Título, type: string }
      - { name: subtitulo, label: Texto, type: text }
      - name: refeicoes
        label: Refeições oferecidas
        type: object
        list: true
        fields:
          - { name: nome, label: Refeição, type: string }
      - { name: observacao, label: "Observação (alergias, cardápio, nutricionista...)", type: text }

  # ------------------------------------------------------------------
  - name: escola
    label: "8. ⚙️ Contatos, horário e matrículas"
    description: "Telefone, WhatsApp, endereço, horário e a faixa 'Matrículas abertas' do topo do site. Os campos com 🔒 são técnicos: só a Mary altera."
    type: file
    path: src/_data/escola.yml
    format: yaml
    fields:
      - name: matriculas
        label: Faixa de matrículas (tarja no topo do site)
        type: object
        fields:
          - { name: ativo, label: Mostrar a faixa?, type: boolean }
          - { name: texto, label: "Texto da faixa (ex.: Matrículas abertas para 2028)", type: string }
          - { name: botao, label: Texto do link, type: string }
      - name: whatsapp
        label: WhatsApp (só números, começando com 55 e o DDD)
        type: string
        required: true
        description: "Ex.: 551141511787. É o número que abre a conversa quando os pais clicam."
      - { name: whatsapp_exibicao, label: "WhatsApp como aparece escrito no site", type: string, description: "Ex.: (11) 4151-1787" }
      - { name: whatsapp_mensagem, label: Mensagem que já vem escrita quando os pais abrem o WhatsApp, type: text }
      - { name: telefone, label: Telefone fixo (só números com DDD), type: string }
      - { name: telefone_exibicao, label: Telefone como aparece escrito no site, type: string }
      - { name: email, label: E-mail, type: string }
      - { name: instagram, label: Instagram (sem @), type: string }
      - { name: horario, label: "Horário (ex.: Segunda a sexta, das 7h às 18h30)", type: string }
      - { name: horario_abre, label: "Abre às (ex.: 07:00)", type: string }
      - { name: horario_fecha, label: "Fecha às (ex.: 18:30)", type: string }
      - { name: periodos, label: Períodos, type: string }
      - { name: google_nota, label: "Nota no Google (ex.: 5,0)", type: string, description: "Atualize quando mudar. Vazio = selo escondido." }
      - { name: google_total, label: Número de avaliações no Google, type: number }
      - name: endereco
        label: Endereço
        type: object
        fields:
          - { name: rua, label: Rua e número, type: string }
          - { name: bairro, label: Bairro, type: string }
          - { name: cidade, label: Cidade, type: string }
          - { name: uf, label: Estado, type: string }
          - { name: cep, label: CEP, type: string }
          - { name: link_mapa, label: Link do Google Maps, type: string }
          - { name: regiao_atendida, label: Região atendida, type: string }
          - { name: latitude, label: 🔒 Latitude, type: number, readonly: true }
          - { name: longitude, label: 🔒 Longitude, type: number, readonly: true }
      - { name: nome, label: Nome da escola, type: string, required: true }
      - { name: nome_completo, label: Nome completo (aparece no Google), type: string }
      - { name: slogan, label: Slogan, type: string }
      - { name: ano_fundacao, label: Ano de fundação, type: number }
      - { name: razao_social, label: Razão social, type: string }
      - { name: cnpj, label: CNPJ, type: string }
      - { name: google_avaliacoes_link, label: 🔒 Link das avaliações no Google, type: string, readonly: true }
      - { name: agenda_online_link, label: 🔒 Link da agenda de visitas online, type: string, readonly: true }
      - { name: url, label: 🔒 Endereço do site, type: string, readonly: true }
      - { name: formulario_endpoint, label: 🔒 Formulário (endpoint), type: string, readonly: true }
      - { name: formulario_chave, label: 🔒 Formulário (chave), type: string, readonly: true }
      - { name: google_analytics_id, label: 🔒 Google Analytics, type: string, readonly: true }
      - { name: meta_pixel_id, label: 🔒 Meta Pixel, type: string, readonly: true }
      - { name: credito_link, label: 🔒 Link da EngrenaLab (rodapé), type: string, readonly: true }
